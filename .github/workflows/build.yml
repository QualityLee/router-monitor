name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    # 纯文档改动不必编译（一次云构建好几分钟）
    paths-ignore:
      - '**.md'
      - '_test_parser.py'
      - '_lint_kt.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # NOTE: do NOT use android-actions/setup-android -- it runs `sdkmanager tools`
      # which no longer exists and hard-fails. The ubuntu runner image already
      # ships with an Android SDK, we just add the packages we need.
      - name: Install Android SDK packages
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools" \
                      -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          echo "sdkmanager => $SDKMGR"
          test -n "$SDKMGR"

          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

          echo "--- installed platforms ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "--- installed build-tools ---"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --console=plain --stacktrace

      - name: Show output
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
